server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API: the browser calls /api, nginx forwards it to the API container.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 6m;
    }

    # Single-page app: unknown paths load index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}
